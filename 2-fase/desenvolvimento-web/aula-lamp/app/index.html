<!DOCTYPE html>

      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white fw-semibold">Nova cidade</div>
          <div class="card-body">
            <form action="back/cidade-inserir.php" method="get">
              <div class="mb-3">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" name="cidade" id="cidade" class="form-control" placeholder="Ex.: Joaçaba">
              </div>
              <div class="mb-4">
                <label for="uf" class="form-label">UF</label>
                <input type="text" name="uf" id="uf" class="form-control" maxlength="2" placeholder="Ex.: SC">

              <div class="d-grid">
                <input type="submit" class="btn btn-primary" value="INSERIR">
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white fw-semibold">Novo aluno</div>

            <form action="back/aluno-inserir.php" method="get">
              <div class="row g-3 mb-4">

                </div>
                <div class="col-md-6">

                  <input type="text" name="cpf" id="cpf" class="form-control" placeholder="000.000.000-00">

                <div class="col-md-6">

                  <input type="text" name="telefone" id="telefone" class="form-control" placeholder="(00) 00000-0000">

                <div class="col-12">

              <div class="d-grid">
                <input type="submit" class="btn btn-success" value="INSERIR">
