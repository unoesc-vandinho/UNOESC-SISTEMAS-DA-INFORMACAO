services:
  lamp:
    image: mattrayner/lamp:latest
    container_name: aula-lamp
    ports:
      - "8080:8080"
      - "8081:80"
      - "3306:3306"
    environment:
      MYSQL_ADMIN_PASS: admin
    volumes:
      - ./app:/app
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    container_name: aula-lamp-phpmyadmin
    network_mode: "service:lamp"
    environment:
      PMA_HOST: 127.0.0.1
    depends_on:
      - lamp

volumes:
  mysql-data:
