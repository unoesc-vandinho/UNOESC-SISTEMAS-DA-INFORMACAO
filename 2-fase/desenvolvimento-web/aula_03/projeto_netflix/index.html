<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="source/img/favicon.png">
    <link rel="stylesheet" href="source/style.css">
    <title>PirataFilx</title>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="navbar-top" aria-label="Navegação principal">
                <div class="brand" aria-label="PirataFilx">
                    <span class="brand-mark">P</span>
                    <span class="brand-name">PirataFilx</span>
                </div>
            </div>

            <div class="hero-banner">
                <div class="hero-content">
                    <span class="hero-kicker">Top 10 da semana</span>
                    <h1>Clássicos que marcam a cultura pop</h1>
                    <p>
                        Explore os melhores filmes, do drama ao suspense, em uma experiência visual poderosa
                        e imersiva.
                    </p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container py-5">
            <div class="section-heading d-flex justify-content-between align-items-center mb-4 px-2">
                <h2 class="fw-bold mb-0 text-white">Em alta agora</h2>
                <span class="see-all">Ver tudo</span>
            </div>
            <div id="movie" class="row justify-content-center">
            </div>
        </div>
    </main>

    <div class="modal fade" id="movieModal" tabindex="-1" aria-labelledby="movieModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="movieModalLabel">Detalhes do filme</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="movieModalBody">
                    <div class="text-center text-muted">Carregando...</div>
                </div>
                <div class="modal-footer">
                    <button id="trailerLink" type="button" class="btn btn-danger">Assistir trailer</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="source/script.js"></script>
</body>

</html>
